name: Exp10b preload RCE (verbatim)

# Full copy of the workflow under audit, with the minimum substitutions
# needed to run outside its home repo (all marked ADAPTED). Security shape
# preserved exactly: triggers, triage gate, install-before-checkout,
# default-branch sparse checkout, PR-head checkout, BUN_CONFIG_FILE=/dev/null
# on every post-checkout exec.
#
# ADAPTED-1: review-cli (private GitHub Packages) -> tiny compiled bun
#   binary built in scratch dir. If anything MORE exposed, not less.
# ADAPTED-2: automate-pr composite action (absent here) -> skipped on
#   pull_request events only, outputs hardcoded non-automated. The action
#   resolves from the default-branch sparse checkout in the real workflow;
#   nothing about it affects the preload question.
# ADAPTED-3: .claude/review.yml default-branch checkout -> synthetic
#   policy file written in the step (same path). Verifies the checkout
#   mechanics without the private config.
# ADAPTED-4: No secrets passed to the review job (no SA_JSON equivalent
#   needed for the preload proof). Worst case here is a marker file;
#   on the real workflow the same preload inherits GITHUB_TOKEN + LLM keys.
# ADAPTED-5: Claude Code binary install step omitted (network install of a
#   release binary, orthogonal to the preload question).
# ADAPTED-6: bullfrog step omitted (no secret available; orthogonal).
# ADAPTED-7: Comment/reaction steps use gh CLI directly instead of the
#   review-cli binary (same API calls, minus the binary under test —
#   avoids confounding the result).
#
# SUCCESS (vulnerable) = attacker-controlled preload.ts executes after the
# PR-head checkout despite BUN_CONFIG_FILE=/dev/null, writing ./PWNED_PRELOAD.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      force_review:
        description: "Force a full review even if the code hasn't changed (bypasses change detection)"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.pull_request.head.repo.fork == false
    && (github.event.pull_request.draft == false
    || github.event.action == 'ready_for_review') }}

env:
  REVIEW_CLI_VERSION: '1.10.1'
  CLAUDE_CODE_VERSION: '2.1.212'
  BUN_VERSION: '1.3.13'

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request'
        && !github.event.pull_request.head.repo.fork
        && (github.event.pull_request.draft == false
            || github.event.action == 'ready_for_review')) ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@request-claude-review')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && !github.event.pull_request.head.repo.fork
        && contains(github.event.comment.body, '@request-claude-review')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
      trigger_source: ${{ steps.gate.outputs.trigger_source }}
      note: ${{ steps.gate.outputs.note }}
      commenter: ${{ steps.gate.outputs.commenter }}
      thread_anchor: ${{ steps.gate.outputs.thread_anchor }}
      reply_id: ${{ steps.post_reply.outputs.id }}
      is_automated: ${{ steps.automated.outputs.is_automated }}
      category: ${{ steps.automated.outputs.category }}
      skip_reason: ${{ steps.automated.outputs.skip_reason }}
    steps:
      # ADAPTED-6: bullfrog omitted.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ADAPTED-1: build stand-in CLI binary instead of bun add @uniswap/review-cli.
      - name: Install review-cli
        id: install
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/review-cli-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          cat > revcli.ts <<'EOF'
          const args = process.argv.slice(2);
          const cmd = args[0] ?? "";
          if (cmd === "triage") {
            const fs = await import("fs");
            const out = process.env.GITHUB_OUTPUT ?? "";
            const num =
              process.env.NUMBER ??
              (await import("./eventnum.mjs").catch(() => ({ num: "" }))).num ??
              "";
            fs.appendFileSync(out, `run=true\npr_number=${num}\ncomment_id=\ntrigger_source=api\nnote=\ncommenter=\nthread_anchor=\n`);
          } else if (cmd === "react" || cmd === "reply" || cmd === "post") {
            console.log(`revcli ${cmd} (stub)`);
          } else if (cmd === "review") {
            console.log("revcli review (stub) OK");
          } else {
            console.log(`revcli: unknown command ${cmd}`);
          }
          EOF
          cat > eventnum.mjs <<'EOF'
          import fs from "fs";
          const ev = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          export const num = String(ev.pull_request?.number ?? ev.issue?.number ?? "");
          EOF
          bun build --compile ./revcli.ts --outfile revcli
          echo "bin=$install_dir/revcli" >> "$GITHUB_OUTPUT"

      # ADAPTED-3: synthetic policy file instead of private .claude/review.yml.
      - name: Checkout gate policy from the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Verify gate policy is on disk and parseable
        run: |
          set -euo pipefail
          echo "skip:" > .claude-review-policy.yml
          echo "  authors: []" >> .claude-review-policy.yml
          echo "  drafts: false" >> .claude-review-policy.yml
          python3 -c 'import yaml; yaml.safe_load(open(".claude-review-policy.yml"))'
          echo "synthetic gate policy present and parseable"

      # ADAPTED-2: no check-automated-pr action in this repo; hardcode non-automated.
      - name: Check for automated PR
        id: automated
        if: github.event_name == 'pull_request'
        run: |
          echo "is_automated=false" >> "$GITHUB_OUTPUT"
          echo "category=human" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"

      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: '"$REVIEW_CLI" triage --from-github-actions'

      - name: Acknowledge comment trigger
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.comment_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'echo "(stub) ack reaction"'

      - name: Post running-state reply
        id: post_reply
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.comment_id != ''
        continue-on-error: true
        run: 'echo "(stub) reply"'

  review:
    name: AI review
    needs: triage
    if: |
      needs.triage.outputs.run == 'true' &&
      (needs.triage.outputs.is_automated != 'true' || needs.triage.outputs.category == 'deps')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
    timeout-minutes: 30
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install review-cli
        id: install
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/review-cli-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          cat > revcli.ts <<'EOF'
          const args = process.argv.slice(2);
          const cmd = args[0] ?? "";
          if (cmd === "review") {
            console.log("revcli review (stub) OK");
          } else if (cmd === "post") {
            console.log("revcli post (stub) OK");
          } else {
            console.log(`revcli: unknown command ${cmd}`);
          }
          EOF
          bun build --compile ./revcli.ts --outfile revcli
          echo "bin=$install_dir/revcli" >> "$GITHUB_OUTPUT"

      - name: Validate PR number
        env:
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            '' | *[!0-9]*)
              echo "::error::Refusing to proceed: pr_number is not numeric."
              exit 1
              ;;
          esac
          echo "pr_number validated: $PR_NUMBER"

      - name: Refuse fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: |
          set -euo pipefail
          HEAD_REPO=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')
          if [ -z "$HEAD_REPO" ]; then
            echo "::error::Could not resolve the head repository for PR #$PR_NUMBER. Refusing to proceed."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "::error::Refusing to review a fork PR (head=$HEAD_REPO)."
            exit 1
          fi
          echo "same-repo PR confirmed (head=$HEAD_REPO)"

      - name: Verify an LLM credential is present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: dummy-for-exp10b
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No LLM credential."
            exit 1
          fi

      # ADAPTED-5: Claude Code binary install omitted.

      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ needs.triage.outputs.pr_number }}/head

      - name: Pre — running sticky placeholder
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: '"$REVIEW_CLI" post "$PR_NUMBER" --repo "$GH_REPO" --pre'

      - name: Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_NOTE: ${{ needs.triage.outputs.note }}
          REVIEW_TRIGGER_SOURCE: ${{ needs.triage.outputs.trigger_source }}
          REVIEW_COMMENTER: ${{ needs.triage.outputs.commenter }}
          REVIEW_THREAD_ANCHOR: ${{ needs.triage.outputs.thread_anchor }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: |
          "$REVIEW_CLI" review "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --trigger-source "$REVIEW_TRIGGER_SOURCE" \
            --live
          echo "--- preload marker check ---"
          if [ -f ./PWNED_PRELOAD ]; then
            echo "::error::PRELOAD EXECUTED: ./PWNED_PRELOAD exists. BUN_CONFIG_FILE=/dev/null did not stop it."
            cat ./PWNED_PRELOAD
            exit 1
          else
            echo "preload did NOT execute (marker absent)"
          fi

      - name: Post
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: '"$REVIEW_CLI" post "$PR_NUMBER" --repo "$GH_REPO"'

  review-skipped:
    name: Review skipped
    needs: triage
    if: |
      needs.triage.outputs.is_automated == 'true' &&
      needs.triage.outputs.category != 'deps'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report skipped review
        env:
          SKIP_REASON: ${{ needs.triage.outputs.skip_reason }}
        run: |
          echo "::notice::Code review skipped for automated PR: $SKIP_REASON"
